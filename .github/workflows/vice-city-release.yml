name: Publish Vice City finished MV
on:
  push:
    branches: [vice-city-my-home]
    paths: ['delivery/parts/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reassemble and verify the finished master
        run: python3 delivery/release.py
      - name: Package editable project and artwork
        run: python3 source/make_delivery.py
      - name: Upload the finished film and downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload vice-city-v1.0.0 output/Vice_City_My_Home_1080p60_HQ.mp4 output/Vice_City_My_Home_Editable_Project.zip output/Vice_City_My_Home_AI_Assets.zip output/Vice_City_My_Home_Bilingual.srt output/Vice_City_My_Home_Cover.jpg delivery/validation.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit vice-city-v1.0.0 --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
